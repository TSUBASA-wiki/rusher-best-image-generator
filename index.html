<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>RUSHER Rating Tool</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        <script>
        const onClickDownload = () => {
        const target = document.getElementById("img-container");
        if (target) {
          html2canvas(target).then((canvas) => {
            const downloadLink = document.createElement("a");
            downloadLink.href = canvas.toDataURL("image/png");
            downloadLink.download = "target.png";
            downloadLink.click();
          });
        }
      };      
    </script>
        <style>
            #song-container{
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }
            .song_card{
                display: flex;
                flex-direction: column;
                width: 40rem;
                max-width: 100%;
                border: 1px solid #000000;
                border-radius: 0.25rem;
                gap: 12px;
                padding: 0.75rem;
                box-sizing: border-box;
            }
            .song_information{
                display: flex;
                justify-content: space-between;
                gap: 12px;
                align-items: center;
                width: 100%;
            }
            .song_texts{
                display: flex;
                flex-direction: column;
                min-width: 0;
                flex: 1;
            }
            .song_charts{
                padding: 0.5rem;
                flex: 1;
            }
            .title{
                text-align: center; font-size: x-large; font-weight: bold; min-width: 0;
            }
            .artist{
                text-align: center; font-size: medium;
            }
            .jacket {
                object-fit: cover;
                flex-shrink: 0;
                width: 100px;
                height: 100px;
            }
            .difficulty{
                display: grid;
                grid-template-columns: 5rem 2rem 7.5rem 7.5rem 7.5rem 1fr;
                align-items: center;
                gap: 10px;
            }
            .accscore{
                width: 100%;
                min-width: 0;
                box-sizing: border-box;
            }
            .dscore{
                width:100%;
                min-width: 0;
                box-sizing: border-box;
            }
            .rating{
                text-align: right;
                font-weight: bold;
                font-variant-numeric: tabular-nums;
                line-height: 1;
            }
            .difficulty label{
                display: flex;
            }
            .difficulty_name{
                text-align: left;
                font-weight: bold;
                line-height: 1;
            }
            .difficulty_constant{
                text-align: center;
                font-variant-numeric: tabular-nums;
                line-height: 1;
            }
            .difficulty[data-song-diff="Exposition"]{
                background-color: #95bdfc
            }
            .difficulty[data-song-diff="Rising"]{
                background-color: #eafa39
            }
            .difficulty[data-song-diff="Climax"]{
                background-color: #f0542d
            }
            .difficulty[data-song-diff="Descent"]{
                background-color: #dcbbe0
            }
            .image_difficulty_name[data-song-diff="Exposition"]{
                color: #95bdfc
            }
            .image_difficulty_name[data-song-diff="Rising"]{
                color: #eafa39
            }
            .image_difficulty_name[data-song-diff="Climax"]{
                color: #f0542d
            }
            .image_difficulty_name[data-song-diff="Descent"]{
                color: #dcbbe0
            }
            #img-container{
                width: 1200px;
                height: 1200px;
                background-color: rgba(0, 255, 128, 0.709);
            }
            #img_best_songs{
                display: grid;
                grid-template-columns: repeat(5, minmax(0, 1fr));
                box-sizing: border-box;
                justify-content: center;
            }
            .rank_image_card{
                display: flex;
                flex-direction: column;
                flex-wrap: nowrap;
                min-width: none;
            }
            .player_info{
                font-size: x-large;
                font-weight: bold;
                align-self: center;
                text-align: center;
                display: block;
            }
            .image_jacket{
                box-sizing: border-box;
                width: 100px;
                height: 100px;
            }
            .rank_jacket{
                align-self: center;

            }
            .image_title{
                display: block;
                text-align: center;
                overflow: hidden;
                text-overflow: ellipsis;
                text-wrap: nowrap;
                min-width: 0px;
                align-self: center;
                font-weight: bold;
            }
            .ohmygod{
                text-align: center;
                align-self: center;
                display: block;
                font-weight: bold;
            }
            .image_rating{
                font-weight: bold;
            }
            .score_stuff_i_guess{
                text-align: center;
                align-self: center;
                display: block;
            }
            .i_might_be_the_worst_css_user_ever{
                text-align: center;
                align-self: center;
                display: block;
            }
            input[type=number] {
                -moz-appearance: textfield;
                appearance: textfield;
            }
            input::-webkit-outer-spin-button,input::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }

        </style>
    </head>
    <body>
        <div id="song-container">
        </div>
        <div id="img-container">
            <div id="img_header">
                <span class="image_title">Project : RUSHER Best Songs Generator</span>
            </div>
            <div id="img_player_info"></div>
            <div id="img_best_songs"></div>
        </div>
        <template id="song_card">
            <div class="song_card">
                <div class="song_information">
                    <div class="song_texts">
                        <span class="title"></span>
                        <span class="artist"></span>
                    </div>
                    <img class="jacket"/>
                </div>
                <div class="song_charts"></div>
            </div>
        </template>
        <template id="difficulty">
            <div class="difficulty">
                <span class="difficulty_name"></span>
                <span class="difficulty_constant"></span>
                <label>Score:<input type="number" class="accscore" placeholder="0-100%" min="0" max="100" step="any" />+</label>
                <label><input type="number" class="dscore" placeholder="0-1%" min="0" max="1" step="any" />%</label> 
                <label>FC:<input type="checkbox" class="fc" /></label>
                <span class="rating"></span>
            </div>
        </template>
        <template id="player_info">
            <div class="player_info">
                <label>Player Name:</label><span class="player_name"></span><br>
                <label>Rating:</label><span class="player_rating"></span>
            </div>
        </template>
        <template id="song_ranks">
            <div class="rank_image_card">
                <div class="rank_jacket">
                    <img class="image_jacket">
                </div>
                <div class="rank_title">
                    <span class="image_title"></span>
                </div>
                <div class="rank_otherstuff">
                    <label class="ohmygod">#<span class="image_rank"></span></label>
                    <div class="score_stuff_i_guess">
                        <label>Score</label>
                        <label><span class="image_accscore"></span>%+</label>
                        <label><span class="image_dscore"></span>%</label><br>
                    </div>
                    <div class="i_might_be_the_worst_css_user_ever">
                        <span class="image_difficulty_name"></span>
                        <span class="image_constant"></span>
                        <label>Rating:</label>
                        <span class="image_rating"></span>
                    </div>
                </div>
            </div>
        </template>
        <template id="downloadbutton">
            <button type="button" onclick="onClickDownload()">Download Image</button>
        </template>
        <button type="button" onclick="generate_image()" id="generatebutton">Generate Image</button> 
        <input type="text" id="playername_input" placeholder="Player Name">
        <script src="script.js"></script>
    </body>
</html>
